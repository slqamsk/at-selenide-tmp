
plugins {
    id 'java'
    id 'io.qameta.allure' version '4.3.0'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'com.codeborne:selenide:7.19.1'

    testImplementation platform('io.qameta.allure:allure-bom:3.0.0')
    testImplementation 'io.qameta.allure:allure-jupiter'
    testImplementation 'io.qameta.allure:allure-selenide'

    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.16'
}

tasks.test {
    useJUnitPlatform()
}

tasks.withType(Test).configureEach {
    systemProperty 'selenide.browser',
            System.getProperty('selenide.browser', 'chrome')

    systemProperty 'selenide.headless',
            System.getProperty('selenide.headless', 'false')

    systemProperty 'chromeoptions.args',
            System.getProperty('chromeoptions.args', '')

    systemProperty 'selenide.webdriverLogsEnabled',
            System.getProperty('selenide.webdriverLogsEnabled', 'false')

    systemProperty 'webdriver.chrome.verboseLogging',
            System.getProperty('webdriver.chrome.verboseLogging', 'false')
}
